name: Release

on:
  push:
    tags:
      - 'release/*'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Build the .vsix but skip publishing'
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  build:
    name: Build and package
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.meta.outputs.version }}
      vsix: ${{ steps.meta.outputs.vsix }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Resolve version and verify tag
        id: meta
        shell: bash
        run: |
          PKG_VERSION=$(node -p "require('./package.json').version")
          echo "version=$PKG_VERSION" >> "$GITHUB_OUTPUT"
          echo "vsix=jaenvtix-$PKG_VERSION.vsix" >> "$GITHUB_OUTPUT"
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            TAG_VERSION="${GITHUB_REF_NAME#release/}"
            if [ "$PKG_VERSION" != "$TAG_VERSION" ]; then
              echo "::error::Tag release/$TAG_VERSION does not match package.json version $PKG_VERSION"
              exit 1
            fi
          fi

      - name: Lint
        run: npm run lint

      - name: Compile
        run: npm run compile

      - name: Package .vsix
        run: npx --yes @vscode/vsce package --out "${{ steps.meta.outputs.vsix }}"

      - uses: actions/upload-artifact@v4
        with:
          name: vsix
          path: ${{ steps.meta.outputs.vsix }}
          if-no-files-found: error
          retention-days: 30

  publish:
    name: Publish to Open VSX
    needs: build
    if: github.event_name == 'push' || inputs.dry_run == false
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: vsix

      - name: Publish to Open VSX
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
        run: npx --yes ovsx publish "${{ needs.build.outputs.vsix }}" --pat "$OVSX_PAT"

      - name: Create GitHub Release
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ needs.build.outputs.vsix }}
          generate_release_notes: true
          fail_on_unmatched_files: true
