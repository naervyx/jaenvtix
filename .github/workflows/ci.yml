name: CI

on:
  pull_request:
    branches:
      - develop

permissions:
  contents: read

concurrency:
  # Cancel any in-flight CI for the same PR when a new commit lands.
  # Saves a full pipeline run on every push during PR iteration.
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Node 22 is the current LTS and is the first line that natively
  # globs `node --test "test/**/*.test.ts"` (Node 20 leaves the literal
  # quoted string and fails with "Could not find ...").
  # Node stays on the runner even though Bun manages packages: the test
  # suite (and the extension itself) runs on the Node runtime.
  NODE_VERSION: '22'
  BUN_VERSION: '1.3.14'

jobs:
  test:
    # `bun run test` triggers the `pretest` script in package.json, which
    # runs `bun run compile && bun run lint`, then runs the unit tests. So
    # a single `bun run test` already covers lint + tsc + tests — no need
    # to invoke them as separate steps. (Note: `bun run test`, never
    # `bun test` — the latter is Bun's own test runner, not our script.)
    name: Lint + compile + test (ubuntu)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Cache node_modules
        id: nm-cache
        uses: actions/cache@v5
        with:
          # Cache the resolved node_modules tree. On a cache hit we skip
          # `bun install` entirely — the install step becomes a ~2s cache
          # restore instead of a full install.
          path: node_modules
          key: nm-${{ runner.os }}-bun${{ env.BUN_VERSION }}-${{ hashFiles('bun.lock') }}

      - name: Install dependencies
        if: steps.nm-cache.outputs.cache-hit != 'true'
        # --frozen-lockfile is the CI-safe equivalent of `npm ci`: it
        # fails instead of silently rewriting bun.lock on drift.
        run: bun install --frozen-lockfile

      - name: bun run test (pretest=compile+lint, then unit tests)
        run: bun run test

  permissions-matrix:
    # Only the tests that exercise OS-level filesystem behavior (POSIX chmod
    # bits, recursive bin/ permission walks) are worth running on the full
    # OS matrix. Archive extraction logic is exercised hermetically via
    # synthetic tar/zip fixtures in the `test` job, so it would be redundant
    # to repeat it on every runner.
    name: Permissions tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Cache node_modules
        id: nm-cache
        uses: actions/cache@v5
        with:
          # Per-OS cache key — node_modules can carry native binaries that
          # differ between linux / macos / windows.
          path: node_modules
          key: nm-${{ runner.os }}-bun${{ env.BUN_VERSION }}-${{ hashFiles('bun.lock') }}

      - name: Install dependencies
        if: steps.nm-cache.outputs.cache-hit != 'true'
        run: bun install --frozen-lockfile

      - name: Run permission-sensitive tests
        shell: bash
        run: |
          # Only files that genuinely exercise OS-level FS behavior. Listed
          # individually so a brand-new file is opt-in (not picked up by a
          # blanket glob). Files that don't yet exist on this branch are
          # skipped — keeps the workflow forward-compatible during the
          # rollout of the SDD test suite.
          candidates=(
            test/configuration/steps/processDownloadsStep.test.ts
            test/file/unpacker/tarGz.test.ts
            test/build/mavenWrapperScript.test.ts
          )
          present=()
          for f in "${candidates[@]}"; do
            [ -f "$f" ] && present+=("$f")
          done
          if [ ${#present[@]} -eq 0 ]; then
            echo "::warning::No permission-sensitive test files present on this branch; nothing to run."
            exit 0
          fi
          echo "Running: ${present[*]}"
          node --import tsx --test "${present[@]}"
