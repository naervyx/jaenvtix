name: CI

on:
  pull_request:
    branches:
      - develop

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-test:
    name: Lint, test, compile (ubuntu)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint (zero warnings)
        run: npx eslint src test --max-warnings=0

      - name: Type-check tests
        run: npx tsc --noEmit -p tsconfig.test.json

      - name: Unit tests
        run: npm test

      - name: Compile production sources
        run: npm run compile

  permissions-matrix:
    # Only the tests that exercise OS-level filesystem behavior (POSIX chmod
    # bits, recursive bin/ permission walks) are worth running on the full
    # OS matrix. Archive extraction logic is exercised hermetically via
    # synthetic tar/zip fixtures in `lint-and-test`, so it would be
    # redundant to repeat it on every runner.
    name: Permissions tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run permission-sensitive tests
        shell: bash
        run: |
          # Only files that genuinely exercise OS-level FS behavior. Listed
          # individually so a brand-new file is opt-in (not picked up by a
          # blanket glob). Files that don't yet exist on this branch are
          # skipped — keeps the workflow forward-compatible during the
          # rollout of the SDD test suite.
          candidates=(
            test/configuration/steps/processDownloadsStep.test.ts
            test/file/unpacker/tarGz.test.ts
            test/build/mavenWrapperScript.test.ts
          )
          present=()
          for f in "${candidates[@]}"; do
            [ -f "$f" ] && present+=("$f")
          done
          if [ ${#present[@]} -eq 0 ]; then
            echo "::warning::No permission-sensitive test files present on this branch; nothing to run."
            exit 0
          fi
          echo "Running: ${present[*]}"
          node --import tsx --test "${present[@]}"
