name: CI

on:
  pull_request:
    branches:
      - develop

permissions:
  contents: read

concurrency:
  # Cancel any in-flight CI for the same PR when a new commit lands.
  # Saves a full pipeline run on every push during PR iteration.
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Node 22 is the current LTS and is the first line that natively
  # globs `node --test "test/**/*.test.ts"` (Node 20 leaves the literal
  # quoted string and fails with "Could not find ...").
  NODE_VERSION: '22'

jobs:
  test:
    # `npm test` triggers the `pretest` script in package.json, which runs
    # `npm run compile && npm run lint`, then runs the unit tests. So a
    # single `npm test` already covers lint + tsc + tests — no need to
    # invoke them as separate steps.
    name: Lint + compile + test (ubuntu)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Cache node_modules
        id: nm-cache
        uses: actions/cache@v4
        with:
          # Cache the resolved node_modules tree (not just the npm
          # download cache that setup-node already handles). On a cache
          # hit we skip `npm ci` entirely — the install step becomes a
          # ~2s cache restore instead of a 60s+ install.
          path: node_modules
          key: nm-${{ runner.os }}-node${{ env.NODE_VERSION }}-${{ hashFiles('package-lock.json') }}

      - name: Install dependencies
        if: steps.nm-cache.outputs.cache-hit != 'true'
        # --prefer-offline uses the npm cache restored by setup-node,
        # --no-audit and --no-fund cut roughly 5-10s of post-install noise.
        run: npm ci --prefer-offline --no-audit --no-fund

      - name: npm test (pretest=compile+lint, then unit tests)
        run: npm test

  permissions-matrix:
    # Only the tests that exercise OS-level filesystem behavior (POSIX chmod
    # bits, recursive bin/ permission walks) are worth running on the full
    # OS matrix. Archive extraction logic is exercised hermetically via
    # synthetic tar/zip fixtures in the `test` job, so it would be redundant
    # to repeat it on every runner.
    name: Permissions tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Cache node_modules
        id: nm-cache
        uses: actions/cache@v4
        with:
          # Per-OS cache key — node_modules can carry native binaries that
          # differ between linux / macos / windows.
          path: node_modules
          key: nm-${{ runner.os }}-node${{ env.NODE_VERSION }}-${{ hashFiles('package-lock.json') }}

      - name: Install dependencies
        if: steps.nm-cache.outputs.cache-hit != 'true'
        run: npm ci --prefer-offline --no-audit --no-fund

      - name: Run permission-sensitive tests
        shell: bash
        run: |
          # Only files that genuinely exercise OS-level FS behavior. Listed
          # individually so a brand-new file is opt-in (not picked up by a
          # blanket glob). Files that don't yet exist on this branch are
          # skipped — keeps the workflow forward-compatible during the
          # rollout of the SDD test suite.
          candidates=(
            test/configuration/steps/processDownloadsStep.test.ts
            test/file/unpacker/tarGz.test.ts
            test/build/mavenWrapperScript.test.ts
          )
          present=()
          for f in "${candidates[@]}"; do
            [ -f "$f" ] && present+=("$f")
          done
          if [ ${#present[@]} -eq 0 ]; then
            echo "::warning::No permission-sensitive test files present on this branch; nothing to run."
            exit 0
          fi
          echo "Running: ${present[*]}"
          node --import tsx --test "${present[@]}"
